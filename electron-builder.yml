appId: com.v2raydp.desktop
productName: v2rayDP Desktop
copyright: Copyright © 2026 Dineth Pansilu Wickramasinghe

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/blocklist_sources.json
    to: blocklist_sources.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/app_logo.png
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: v2rayDP Desktop
  runAfterFinish: true
  installerIcon: public/app_logo.png
  uninstallerIcon: public/app_logo.png

portable:
  artifactName: v2rayDP-Desktop-Portable-${version}.exe
